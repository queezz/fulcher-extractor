site_name: Fulcher Extractor
site_description: SpectroCube Fulcher-alpha line extraction workflow.
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
plugins:
  - search
  - mkdocstrings
nav:
  - Home: index.md
  - Workflow: workflow.md
  - Line Database: line_database.md
  - QC: qc.md

