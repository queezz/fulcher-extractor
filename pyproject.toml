[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fulcher-extractor"
version = "0.3.0"
description = "SpectroCube Fulcher-alpha line extraction with blended Gaussian fitting and QC."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "A. K.", email = "queezz@gmail.com" },
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "xarray",
  "h5netcdf",
  "h5py",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ipython",
  "ipykernel",
  "jupyter",
  "tqdm",
]
progress = [
  "tqdm",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]>=0.25",
  "pymdown-extensions",
]

[project.scripts]
fulcher-extract = "fulcher_extractor.cli:main"
fulcher-h2-dataset = "fulcher_extractor.h2_dataset_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fulcher_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]
